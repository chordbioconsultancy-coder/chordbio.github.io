<html>
<head>
  <title>Marquee Example</title>
</head>
<body>

<style>
  /* 1. Container hides anything shifting outside its boundaries */
  .marquee-wrapper {
    overflow: hidden;
    width: 100%;
    background-color: #f4f4f4;
    padding: 10px 0;
    white-space: nowrap; /* Forces text blocks onto a single horizontal row */
  }

  /* 2. The inner track holds and animates the items together */
  .marquee-track {
    display: inline-flex;
    gap: 50px; /* Space between each individual text block */
    animation: continuous-scroll 15s linear infinite;
  }

  /* 3. Individual text blocks styling */
  .text-block {
    font-family: sans-serif;
    font-size: 1.2rem;
    font-weight: bold;
    color: #333;
    padding: 5px 15px;
  }

  /* 4. PAUSE ON MOUSEOVER: Freezes the animation timeline */
  .marquee-wrapper:hover .marquee-track {
    animation-play-state: paused;
    cursor: pointer;
  }

  /* 5. Keyframes loop perfectly from 0% to -50% */
  @keyframes continuous-scroll {
    0% {
      transform: translateX(0);
    }
    100% {
      transform: translateX(-50%);
    }
  }
</style>

<div class="marquee-wrapper">
  <!-- The content inside the track is duplicated EXACTLY twice to create a seamless loop -->
  <div class="marquee-track">
    <!-- Original items -->
    <div class="text-block">🚀 Block One: Launching soon</div>
    <div class="text-block">📈 Block Two: Stocks up 5%</div>
    <div class="text-block">🎉 Block Three: Promo code DEAL20</div>
    <div class="text-block">🔥 Block Four: Trending topics</div>
    
    <!-- Duplicate items (Ensures no gap when the first items leave the screen) -->
    <div class="text-block">🚀 Block One: Launching soon</div>
    <div class="text-block">📈 Block Two: Stocks up 5%</div>
    <div class="text-block">🎉 Block Three: Promo code DEAL20</div>
    <div class="text-block">🔥 Block Four: Trending topics</div>
  </div>
</div>
</body>
</html>
